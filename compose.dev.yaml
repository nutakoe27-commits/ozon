name: praktika-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: praktika
      POSTGRES_PASSWORD: praktika_dev
      POSTGRES_DB: praktika
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - dev_db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U praktika -d praktika']
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  dev_db:
