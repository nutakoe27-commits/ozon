<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Ozon Performance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --bg:#0d1018;--surface:#151820;--card:#1c2030;
    --border:#2a3050;--accent:#4f6ef7;--accent2:#00c2ff;
    --text:#e2e8f0;--muted:#64748b;--red:#ef4444;--green:#22c55e;
    --font:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }

  /* glow bg */
  body::before{
    content:'';position:fixed;top:-20%;left:50%;transform:translateX(-50%);
    width:600px;height:600px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(79,110,247,.12) 0%,transparent 70%);
  }

  .wrap{width:100%;max-width:420px;position:relative;z-index:1}

  /* logo */
  .logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
  .logo-icon{
    width:44px;height:44px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,#4f6ef7,#00c2ff);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#fff;
    box-shadow:0 8px 32px rgba(79,110,247,.4);
  }
  .logo-text{font-size:20px;font-weight:700;letter-spacing:-.4px}
  .logo-sub{font-size:12px;color:var(--muted);margin-top:2px}

  /* card */
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:32px;
    box-shadow:0 24px 64px rgba(0,0,0,.4);
  }

  /* tabs */
  .tabs{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:28px}
  .tab{
    flex:1;text-align:center;padding:8px;border-radius:8px;
    cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);
    transition:all .2s;user-select:none;
  }
  .tab.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

  /* form */
  .form-group{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
  .input-wrap{position:relative}
  .input-wrap svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    pointer-events:none;color:var(--muted);
  }
  input[type=email],input[type=password],input[type=text]{
    width:100%;background:var(--surface);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-family:var(--font);
    padding:11px 13px 11px 38px;border-radius:10px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.15)}
  input::placeholder{color:var(--muted)}

  /* eye toggle */
  .eye-toggle{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    cursor:pointer;color:var(--muted);background:none;border:none;padding:2px;
    transition:color .15s;
  }
  .eye-toggle:hover{color:var(--text)}
  input[type=password]{padding-right:40px}

  /* submit */
  .btn-submit{
    width:100%;background:linear-gradient(135deg,#4f6ef7,#00c2ff);
    border:none;border-radius:10px;color:#fff;
    font-size:14px;font-weight:600;font-family:var(--font);
    padding:13px;cursor:pointer;margin-top:8px;
    box-shadow:0 4px 20px rgba(79,110,247,.35);
    transition:opacity .15s,transform .1s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-submit:hover{opacity:.9}
  .btn-submit:active{transform:scale(.99)}
  .btn-submit.loading{opacity:.55;pointer-events:none}
  .btn-submit.loading .spinner{display:block}
  .spinner{
    display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* error */
  .alert{
    display:none;padding:11px 14px;border-radius:9px;font-size:13px;
    margin-bottom:16px;align-items:center;gap:9px;
  }
  .alert.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;display:flex}
  .alert.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);color:#86efac;display:flex}

  /* divider */
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

  .footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo">
    <div class="logo-icon">OP</div>
    <div>
      <div class="logo-text">Ozon Performance</div>
      <div class="logo-sub">Аналитика рекламных кампаний</div>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">Войти</div>
      <div class="tab" id="tabReg" onclick="switchTab('register')">Регистрация</div>
    </div>

    <!-- ALERT -->
    <div class="alert" id="alert">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="alertText"></span>
    </div>

    <!-- LOGIN FORM -->
    <form id="formLogin" onsubmit="submitForm(event,'login')">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <div class="input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="eye-toggle" onclick="togglePwd('loginPassword',this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="btnLogin">
        <div class="spinner"></div>
        Войти
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="formRegister" style="display:none" onsubmit="submitForm(event,'register')">
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>
      <div class="form-group">
        <label>Пароль <span style="color:var(--muted)">(мин. 8 символов)</span></label>
        <div class="input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password" required minlength="8">
          <button type="button" class="eye-toggle" onclick="togglePwd('regPassword',this)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Повторите пароль</label>
        <div class="input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="regPassword2" placeholder="••••••••" autocomplete="new-password" required minlength="8">
        </div>
      </div>
      <button type="submit" class="btn-submit" id="btnReg">
        <div class="spinner"></div>
        Создать аккаунт
      </button>
    </form>
  </div>

  <div class="footer-note">Ozon Performance Dashboard © 2026</div>
</div>

<script>
function switchTab(tab){
  const isLogin = tab==='login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabReg').classList.toggle('active', !isLogin);
  document.getElementById('formLogin').style.display    = isLogin ? '' : 'none';
  document.getElementById('formRegister').style.display = isLogin ? 'none' : '';
  hideAlert();
}

function togglePwd(id, btn){
  const inp = document.getElementById(id);
  const isText = inp.type === 'text';
  inp.type = isText ? 'password' : 'text';
  btn.style.opacity = isText ? '0.5' : '1';
}

async function submitForm(e, type){
  e.preventDefault();
  hideAlert();

  const isLogin = type === 'login';
  const btn = document.getElementById(isLogin ? 'btnLogin' : 'btnReg');
  btn.classList.add('loading');

  const email    = document.getElementById(isLogin ? 'loginEmail'    : 'regEmail').value.trim();
  const password = document.getElementById(isLogin ? 'loginPassword' : 'regPassword').value;

  if(!isLogin){
    const p2 = document.getElementById('regPassword2').value;
    if(password !== p2){ showAlert('Пароли не совпадают', false); btn.classList.remove('loading'); return; }
  }

  try {
    const { resp, data: json } = await requestJson('/' + type, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });

    if(!resp.ok && !json.error){
      showAlert('Ошибка сервера: HTTP ' + resp.status, false);
    } else if(json.error){
      showAlert(json.error, false);
    } else if(json.redirect){
      showAlert(isLogin ? 'Добро пожаловать!' : 'Аккаунт создан!', true);
      setTimeout(()=> window.location.href = json.redirect, 600);
    }
  } catch(err){
    showAlert('Ошибка сети: ' + err.message, false);
  } finally {
    btn.classList.remove('loading');
  }
}

function showAlert(text, success){
  const el = document.getElementById('alert');
  el.className = 'alert ' + (success ? 'success' : 'error');
  document.getElementById('alertText').textContent = text;
}
function hideAlert(){ document.getElementById('alert').className = 'alert'; }

async function requestJson(url, options = {}){
  const resp = await fetch(url, options);
  const text = await resp.text();
  try {
    return { resp, data: text ? JSON.parse(text) : {} };
  } catch (_) {
    const snippet = text.replace(/\s+/g, ' ').trim().slice(0, 160);
    throw new Error(`Некорректный ответ сервера (${resp.status}): ${snippet || 'empty body'}`);
  }
}
</script>
</body>
</html>
