name: Verify platform
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: praktika
          POSTGRES_PASSWORD: praktika_dev
          POSTGRES_DB: praktika_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U praktika -d praktika_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://praktika:praktika_dev@localhost:5432/praktika_test
      DATABASE_URL: postgresql://praktika:praktika_dev@localhost:5432/praktika_e2e
      APP_URL: http://localhost:5173
      DISK_RESERVE_BYTES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node --input-type=module -e "import pg from 'pg'; const db=new pg.Client({connectionString:process.env.TEST_DATABASE_URL}); await db.connect(); await db.query('CREATE DATABASE praktika_e2e'); await db.end();"
      - run: npm run seed:demo
      - run: npx tsx -e "import {processNext} from './server/worker.ts'; import {pool} from './server/db.ts'; (async()=>{await processNext();await pool.end()})().catch(()=>process.exit(1))"
      - run: npm run demo:publish
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
