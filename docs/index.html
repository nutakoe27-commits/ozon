<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ozon Ads Dashboard</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin: 24px; background: #0f172a; color: #e2e8f0; }
    h1 { margin-bottom: 8px; }
    .muted { color: #94a3b8; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; background: #111827; }
    th, td { border: 1px solid #334155; padding: 8px; font-size: 14px; }
    th { background: #1e293b; text-align: left; }
  </style>
</head>
<body>
  <h1>Ozon Ads Dashboard</h1>
  <p class="muted">Данные загружаются из <code>docs/data/unified.json</code>, который генерируется pipeline.</p>
  <table>
    <thead>
      <tr>
        <th>SKU</th>
        <th>Дата</th>
        <th>Показы</th>
        <th>Клики</th>
        <th>Расход</th>
        <th>Заказы (ads)</th>
        <th>Выручка (ads)</th>
        <th>ROAS</th>
        <th>ACOS</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    async function render() {
      const res = await fetch('./data/unified.json');
      if (!res.ok) return;
      const json = await res.json();
      const tbody = document.getElementById('rows');
      const rows = json.unified ?? [];
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.sku}</td>
          <td>${r.day}</td>
          <td>${r.ad.impressions}</td>
          <td>${r.ad.clicks}</td>
          <td>${r.ad.spend.toFixed(2)}</td>
          <td>${r.ad.orders}</td>
          <td>${r.ad.revenue.toFixed(2)}</td>
          <td>${r.computed.roas.toFixed(3)}</td>
          <td>${r.computed.acos.toFixed(3)}</td>
        </tr>
      `).join('');
    }
    render();
  </script>
</body>
</html>
